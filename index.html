<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>FineVu Wi-Fi · Web Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--brand:#DB832D;--brand-d:#C8711E;--brand-l:#FDF1E6;--ink:#1F2226;--sub:#80868E;--sub2:#A9AEB5;--line:#E7E9EC;--bg:#F2F4F5;--card:#fff;--red:#E5534B;--green:#21B573;--teal:#3CC7A6;--blue:#2F80ED}
html,body{height:100%}
body{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo',system-ui,sans-serif;background:#DCE0E5;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
#stage{height:100%;display:flex;align-items:center;justify-content:center;gap:36px;padding:20px}
/* phone frame (Android) */
.phone{position:relative;width:375px;height:812px;border-radius:44px;background:var(--bg);box-shadow:0 0 0 10px #15171a,0 0 0 12px #2b2e33,0 30px 60px rgba(0,0,0,.35);overflow:hidden;flex:none}
.punch{position:absolute;top:12px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#0d0e10;z-index:60}
.sbar{position:absolute;top:0;left:0;right:0;height:34px;padding:9px 24px 0 26px;display:flex;justify-content:space-between;font-size:13px;font-weight:500;z-index:55;color:var(--ink);pointer-events:none}
.sbar.dark{color:#fff}
.sbar-r{display:flex;align-items:center;gap:5px}
.sbar-r b{font-weight:500;font-size:12px}
.bat{width:20px;height:10px;border:1.4px solid currentColor;border-radius:3px;padding:1px;display:inline-flex}
.bat i{display:block;width:78%;background:currentColor;border-radius:1px}
.gbar{position:absolute;bottom:7px;left:50%;width:120px;height:4px;margin-left:-60px;border-radius:3px;background:rgba(0,0,0,.75);z-index:58;pointer-events:none}
.gbar.light{background:rgba(255,255,255,.8)}
.app{position:absolute;inset:0;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:34px}
.scr.white{background:#fff}
.scr.black{background:#000;padding-top:0}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:24px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.anim-in{animation:slin .22s ease-out}
.anim-back{animation:slback .22s ease-out}
@keyframes slin{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
@keyframes slback{from{transform:translateX(-28px);opacity:.4}to{transform:none;opacity:1}}
/* header */
.hd{height:52px;display:flex;align-items:center;padding:0 8px 0 4px;gap:2px;flex:none;background:inherit}
.hd .bk{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.hd .bk:active{background:rgba(0,0,0,.06)}
.hd h1{font-size:18px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
.hd .ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.hd .ic:active{background:rgba(0,0,0,.06)}
/* home */
.home-top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0 20px;height:62px}
.home-top .logo{height:15px}
.home-top .r{display:flex;align-items:center;gap:8px}
.utc{font-size:11.5px;font-weight:700;border:1.5px solid #3a3d42;border-radius:14px;padding:3px 9px;letter-spacing:-.2px}
.utc.dim{opacity:.35}
.upd-btn{width:34px;height:34px;position:relative;display:flex;align-items:center;justify-content:center}
.upd-btn .n{position:absolute;right:-1px;bottom:1px;width:15px;height:15px;border-radius:50%;background:#E53935;color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--bg)}
.home-title{padding:22px 20px 0;font-size:25px;font-weight:800;line-height:1.32;letter-spacing:-.6px;min-height:96px;position:relative}
.home-hero{position:relative;height:200px;margin-top:2px}
.home-hero .car{position:absolute;left:0;right:0;top:0;width:100%;}
.fab-i{position:absolute;right:20px;width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid var(--brand);display:flex;align-items:center;justify-content:center;color:var(--brand);font-weight:800;font-size:19px;box-shadow:0 3px 8px rgba(219,131,45,.25);z-index:3}
.fab-bot{position:absolute;right:16px;width:56px;height:56px;border-radius:50%;background:#DDEBFA;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.18);z-index:3;overflow:hidden}
.fab-bot img{width:58px}
.btn-connect{margin:6px 20px 0;height:56px;border-radius:12px;background:var(--brand);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 40px);box-shadow:0 4px 10px rgba(219,131,45,.25)}
.btn-connect:active{background:var(--brand-d)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 20px 0}
.tile{background:#fff;border-radius:14px;height:126px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:15px;font-weight:500;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.tile:active{background:#f7f7f7}
.tile.dim{color:#A9AEB5}
.tile .ti{height:44px;display:flex;align-items:center;justify-content:center}
.tile .ti img{height:42px}
.live-card{margin:4px 20px 0;background:#fff;border-radius:16px;padding:16px 16px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.03);position:relative}
.live-card .cam{height:48px}
.btn-live{width:100%;height:44px;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.aux{width:100%;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.aux img{width:30px}
.aux .t{flex:1;font-size:12px;line-height:1.3}
.aux .t small{display:block;color:var(--sub);font-size:11px}
.aux b{font-size:20px;color:var(--blue);font-weight:700}
.conn-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:middle;box-shadow:0 0 0 3px rgba(33,181,115,.18)}
/* lists */
.sec-t{font-size:14px;font-weight:700;color:var(--ink);padding:18px 20px 8px}
.list{background:#fff}
.li{display:flex;align-items:center;min-height:54px;padding:10px 20px;gap:12px;border-bottom:1px solid var(--line);font-size:15px;position:relative}
.li:last-child{border-bottom:0}
.li.tap:active{background:#f6f6f6}
.li .lt{flex:1;min-width:0}
.li .lt small{display:block;font-size:12px;color:var(--sub);margin-top:2px;line-height:1.4}
.li .rv{font-size:13.5px;color:var(--brand);font-weight:500;white-space:nowrap}
.li .rv.g{color:var(--sub)}
.chev{flex:none;color:#B5BAC0}
.li.dis{opacity:.4;pointer-events:none}
/* setting blocks */
.sblock{background:#fff;padding:14px 20px 16px;border-bottom:8px solid var(--bg)}
.sblock:last-child{border-bottom:0}
.sblock .st{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.sblock .st.noM{margin-bottom:0}
.sblock .note{font-size:11.5px;color:var(--sub);line-height:1.5;margin-top:10px;display:flex;gap:5px}
.sblock .note:before{content:'i';flex:none;width:14px;height:14px;border-radius:50%;background:#C3C7CC;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.segs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.segs.c3{grid-template-columns:1fr 1fr 1fr}
.seg{height:40px;border:1px solid #D9DCE0;border-radius:4px;font-size:13.5px;color:#4A4F55;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;padding:0 4px}
.seg.on{border-color:var(--brand);color:var(--brand);font-weight:700;background:#fff}
.seg.dis{opacity:.35;pointer-events:none}
.radios{display:flex;gap:28px}
.radio{display:flex;align-items:center;gap:8px;font-size:14px}
.radio i{width:18px;height:18px;border-radius:50%;border:1.5px solid #C2C6CB;display:inline-block;position:relative}
.radio.on i{border-color:var(--brand)}
.radio.on i:after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--brand)}
.tg{width:46px;height:26px;border-radius:13px;background:#D5D8DC;position:relative;flex:none;transition:.2s}
.tg:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.tg.on{background:var(--brand)}
.tg.on:after{left:23px}
.sld{position:relative;height:30px;margin:4px 6px 0}
.sld .tr{position:absolute;left:0;right:0;top:12px;height:5px;border-radius:3px;background:#E1E3E6}
.sld .fi{position:absolute;left:0;top:12px;height:5px;border-radius:3px;background:var(--brand)}
.sld .th{position:absolute;top:5px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sld .stops{position:absolute;inset:0;display:flex}
.sld .stops b{flex:1}
.sld-l{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin:0 -4px}
.sld-l span{width:44px;text-align:center}
.sld-l span:first-child{text-align:left;width:auto}
.sld-l span:last-child{text-align:right;width:auto}
.quick{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-bottom:8px solid var(--bg)}
.quick button{height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;color:#4A4F55}
.quick button+button{border-left:1px solid var(--line)}
.btn-sm{height:30px;padding:0 14px;border:1px solid #CFD3D8;border-radius:6px;font-size:13px;background:#fff}
.btn-out{height:46px;border:1px solid #CFD3D8;border-radius:6px;width:100%;font-size:16px;font-weight:700;color:var(--red);background:#fff}
.btn-out:disabled{color:#C3C7CC}
.btn-pri{height:50px;border-radius:10px;width:100%;font-size:16px;font-weight:700;color:#fff;background:var(--brand)}
.btn-pri:active{background:var(--brand-d)}
.btn-pri:disabled{background:#D8DBDF}
.btn-gray{height:50px;border-radius:10px;width:100%;font-size:16px;font-weight:700;color:#4A4F55;background:#EDEFF1}
.btn-line{height:50px;border-radius:10px;width:100%;font-size:16px;font-weight:500;color:var(--ink);background:#fff;border:1px solid #D9DCE0}
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:#fff;flex:none}
.tabs2 button{height:46px;font-size:15px;font-weight:500;color:#555;border-bottom:1px solid var(--line)}
.tabs2 button.on{background:var(--brand);color:#fff;font-weight:700;border-color:var(--brand)}
.memwrap{background:#fff}
.membar{display:flex;height:22px;border-radius:4px;overflow:hidden;margin:4px 0 10px}
.membar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:700;transition:.3s;white-space:nowrap;overflow:hidden}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px;color:#555}
.legend span:before{content:'';display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:var(--c)}
/* model list */
.mtabs{display:flex;gap:22px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff;flex:none}
.mtabs button{height:42px;font-size:14px;color:var(--sub);position:relative}
.mtabs button.on{color:var(--ink);font-weight:700}
.mtabs button.on:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.search{margin:4px 20px 8px;height:42px;border-radius:10px;background:#F1F2F4;display:flex;align-items:center;padding:0 12px;gap:8px;color:var(--sub);font-size:14px}
.search input{border:0;background:none;outline:none;flex:1;font-size:14px;color:var(--ink)}
.mli{display:flex;align-items:center;gap:14px;height:62px;padding:0 20px;font-size:15.5px;font-weight:500}
.mli img{width:44px}
.mli .tag{margin-left:auto;font-size:11px;font-weight:700;color:var(--brand);background:var(--brand-l);padding:3px 8px;border-radius:10px}
.mli.off{color:#B4B8BD}
.mli.off img{opacity:.45}
.link{color:var(--blue);font-size:14px;text-decoration:underline;text-underline-offset:3px}
/* connection guide */
.guidebox{margin:6px 20px 0;border:1px dashed #C9CDD2;border-radius:10px;padding:14px 14px;font-size:13.5px;line-height:1.6;color:#3d4146;background:#fff}
.guidebox small{display:block;color:var(--sub);font-size:12px;margin-top:8px;line-height:1.5}
.ap-hd{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 8px;font-size:14px;font-weight:700}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid #E2E4E7;border-top-color:var(--brand);animation:sp 0.9s linear infinite;display:inline-block}
.spin.lg{width:44px;height:44px;border-width:4px}
.spin.w{border-color:rgba(255,255,255,.3);border-top-color:#fff}
@keyframes sp{to{transform:rotate(360deg)}}
.ap{display:flex;align-items:center;gap:12px;height:54px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);font-size:15px}
.ap.hl{background:#FFF8F1}
.ap .wf{color:#4A4F55}
.prereq{padding:14px 20px;font-size:12.5px;color:var(--sub);line-height:1.7}
.center-col{display:flex;flex-direction:column;align-items:center;text-align:center}
.big-t{font-size:21px;font-weight:800;letter-spacing:-.4px;line-height:1.4}
.desc{font-size:14px;color:#5B6067;line-height:1.6}
.pair-img{width:100%;max-width:300px;margin:0 auto;display:block;cursor:pointer}
.pulse-ring{position:relative}
.foot{padding:12px 20px 26px;display:flex;flex-direction:column;gap:10px;flex:none;background:inherit}
.foot.row{flex-direction:row}
.count{display:inline-flex;width:22px;height:22px;border-radius:50%;border:1.5px solid #999;font-size:11px;align-items:center;justify-content:center;margin-left:6px;color:#666}
/* QR scan */
.qrview{flex:1;position:relative;background:#2a2d31 url() center/cover;overflow:hidden}
.qrview .dim{position:absolute;inset:0;background:radial-gradient(transparent 0,transparent 0)}
.qrframe{position:absolute;left:50%;top:44%;width:230px;height:230px;margin:-115px 0 0 -115px;box-shadow:0 0 0 999px rgba(0,0,0,.55);border-radius:6px}
.qrframe i{position:absolute;width:34px;height:34px;border:4px solid #fff}
.qrframe i:nth-child(1){left:-2px;top:-2px;border-right:0;border-bottom:0}
.qrframe i:nth-child(2){right:-2px;top:-2px;border-left:0;border-bottom:0}
.qrframe i:nth-child(3){left:-2px;bottom:-2px;border-right:0;border-top:0}
.qrframe i:nth-child(4){right:-2px;bottom:-2px;border-left:0;border-top:0}
.qrline{position:absolute;left:8px;right:8px;height:2px;background:var(--brand);box-shadow:0 0 10px var(--brand);animation:qrl 1.8s ease-in-out infinite}
@keyframes qrl{0%,100%{top:10px}50%{top:216px}}
.qrtip{position:absolute;left:20px;right:20px;top:18px;background:rgba(255,255,255,.95);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;color:#333}
.qrlcd{position:absolute;left:50%;top:44%;width:200px;margin:-80px 0 0 -100px;opacity:.55;filter:blur(.3px)}
/* live / player */
.vwrap{position:relative;width:100%;aspect-ratio:16/9;background:#111;overflow:hidden}
.vwrap iframe{position:absolute;left:-1px;top:-1px;width:calc(100% + 2px);height:calc(100% + 2px);border:0;pointer-events:none}
.vfallback{position:absolute;inset:0;background:#1a1c1f center/cover;display:flex;align-items:center;justify-content:center;color:#888;font-size:12px}
.osd{position:absolute;left:8px;bottom:6px;font-size:10px;color:#fff;text-shadow:0 1px 2px #000;font-family:monospace;letter-spacing:.3px}
.live-b{position:absolute;right:10px;top:10px;background:#E53935;color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:3px}
.rec-b{position:absolute;left:10px;top:10px;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;text-shadow:0 1px 2px #000}
.rec-b i{width:8px;height:8px;border-radius:50%;background:#E53935;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.pl-top{position:absolute;top:34px;left:0;right:0;height:52px;display:flex;align-items:center;padding:0 10px;gap:8px;z-index:5}
.pl-top .x{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.pill2{display:flex;background:rgba(255,255,255,.14);border-radius:16px;padding:2px;margin-left:auto}
.pill2 button{height:28px;padding:0 12px;border-radius:14px;font-size:12.5px;color:#ddd}
.pill2 button.on{background:#fff;color:#111;font-weight:700}
.spd{height:30px;padding:0 10px;border:1px solid rgba(255,255,255,.6);border-radius:15px;color:#fff;font-size:12.5px;font-weight:700}
.pl-ctrl{background:#2B2D31;border-radius:14px;margin:0 12px;padding:10px 12px 12px;color:#fff}
.prog{display:flex;align-items:center;gap:8px;font-size:11px;color:#bbb;font-family:monospace}
.prog .bar{flex:1;height:4px;border-radius:2px;background:#555;position:relative;cursor:pointer}
.prog .bar div{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:2px}
.prog .bar span{position:absolute;top:-6px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff}
.btns{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.btns button{height:44px;min-width:40px;display:flex;align-items:center;justify-content:center}
.btns img{height:26px}
.btns .pp img{height:30px}
.lv-side{position:absolute;display:flex;flex-direction:column;gap:12px}
.lv-btn{width:52px;height:52px;border-radius:14px;background:rgba(70,72,76,.85);display:flex;align-items:center;justify-content:center}
.lv-btn img{width:52px}
.lv-btn.on{background:var(--brand)}
/* files */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 16px 8px;background:#fff}
.chip{height:34px;border:1px solid #D7DADE;border-radius:4px;font-size:12.5px;color:#555;display:flex;align-items:center;justify-content:center;gap:4px}
.chip.on{border-color:var(--brand);color:var(--brand);font-weight:700}
.chip.on:before{content:'';width:9px;height:5px;border-left:1.6px solid var(--brand);border-bottom:1.6px solid var(--brand);transform:rotate(-45deg) translateY(-2px)}
.datebar{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 10px;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14.5px;font-weight:700}
.datebar button{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.datebar button:disabled{opacity:.25}
.fli{display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:56px;background:#fff;border-bottom:1px solid #F0F1F3;font-size:13.5px;letter-spacing:-.1px}
.fli:active{background:#f7f7f7}
.fli.played .fn{color:#A6ABB1}
.ficon{width:34px;height:38px;position:relative;flex:none}
.ficon .pg{position:absolute;inset:0;border:1.5px solid var(--c,#E07A5F);border-radius:3px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:var(--c,#E07A5F)}
.ficon .pg:after{content:'';position:absolute;right:-1.5px;top:-1.5px;width:9px;height:9px;background:linear-gradient(225deg,var(--bg) 50%,var(--c,#E07A5F) 50%)}
.ficon .dot{position:absolute;right:-4px;bottom:-3px;width:13px;height:13px;border-radius:50%;background:var(--c);color:#fff;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.thumb{width:72px;height:42px;border-radius:4px;background:#333 center/cover;position:relative;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ai{position:absolute;left:3px;bottom:3px;background:rgba(0,0,0,.75);color:#fff;font-size:8.5px;font-weight:800;border-radius:3px;padding:1px 4px}
.thumb .ty{position:absolute;right:3px;top:3px;font-size:8.5px;font-weight:800;color:#fff;border-radius:3px;padding:1px 4px;background:var(--c)}

/* ============ navigation ============ */
const SCR = {};      // id -> {render(p), mount(el,p), leave(), cls}
let stack = [];
let curTimers = [];
function addTimer(id) { curTimers.push(id); return id; }
function clearTimers() { curTimers.forEach(t => { clearTimeout(t); clearInterval(t); }); curTimers = []; }
function render(dir) {
  const top = stack[stack.length - 1];
  const def = SCR[top.id];
  clearTimers();
  const app = $('#app');
  const cls = typeof def.cls === 'function' ? def.cls(top.p) : (def.cls || '');
  app.innerHTML = `<div class="scr ${cls} ${dir === 'back' ? 'anim-back' : dir === 'fwd' ? 'anim-in' : ''}">${def.render(top.p || {})}</div>`;
  const dark = /black/.test(cls);
  $('#sbar').classList.toggle('dark', dark); $('.gbar').classList.toggle('light', dark);
  if (def.mount) def.mount($('#app .scr'), top.p || {});
  syncRec();
}
function go(id, p) { const cur = stack[stack.length - 1]; if (cur && SCR[cur.id].leave) SCR[cur.id].leave(); stack.push({ id, p }); render('fwd'); }
function replace(id, p) { const cur = stack[stack.length - 1]; if (cur && SCR[cur.id].leave) SCR[cur.id].leave(); stack[stack.length - 1] = { id, p }; render('fwd'); }
function back() { if (stack.length <= 1) return; const cur = stack[stack.length - 1]; if (SCR[cur.id].leave) SCR[cur.id].leave(); stack.pop(); render('back'); }
function goHome() { const cur = stack[stack.length - 1]; if (cur && SCR[cur.id].leave) SCR[cur.id].leave(); stack = [{ id: 'home' }]; render('back'); }
function rerender() { const y = $('#app .body') ? $('#app .body').scrollTop : 0; render(); const b = $('#app .body'); if (b) b.scrollTop = y; }
function inStack(...ids) { return stack.some(s => ids.includes(s.id)); }

/* recording state follows the app screens */
function syncRec() {
  if (!S.conn) return;
  if (S.rec === 'update' || S.rec === 'reboot' || S.rec === 'off') return;
  let want = 'rec';
  if (inStack('files')) want = 'stop-play';
  else if (inStack('settings', 'setsub')) want = 'stop-set';
  if (want !== S.rec) {
    const prev = S.rec; S.rec = want;
    if (want === 'stop-play') logDev(T('녹화 중지 (재생 모드 진입)'));
    else if (want === 'stop-set') logDev(T('녹화 중지 (설정 메뉴 진입)'));
    else if (prev === 'stop-play') logDev(T('녹화 재개 (재생 모드 종료)'));
    else if (prev === 'stop-set') logDev(T('녹화 재개 (설정 메뉴 종료)'));
    else renderDemo();
  }
}

function closeLayer() { $('#layer').innerHTML = ''; }
/* modal({title, body, warn, icon, buttons:[{t, pri, fn}], html}) -> Promise(index) */
function modal(o) {
  return new Promise(res => {
    const btns = o.buttons || [{ t: T('확인'), pri: true }];
    $('#layer').innerHTML = `<div class="bkd"></div><div class="modal"><div class="mb">${o.icon ? `<div class="ico">!</div>` : ''}${o.title ? `<h3>${o.title}</h3>` : ''}${o.body ? `<p>${o.body}</p>` : ''}${o.html || ''}${o.warn ? `<div class="warn">${o.warn}</div>` : ''}</div>${btns.length ? `<div class="mbtn">${btns.map((b, i) => `<button data-i="${i}" class="${b.pri ? 'pri' : ''}">${b.t}</button>`).join('')}</div>` : ''}</div>`;
    if (o.onMount) o.onMount($('#layer .modal'));
    $$('#layer .mbtn button').forEach(b => b.onclick = () => {
      const i = +b.dataset.i; const bt = btns[i];
      if (bt.keep && bt.fn && bt.fn($('#layer .modal')) === false) return;
      closeLayer(); if (bt.fn && !bt.keep) bt.fn(); res(i);
    });
  });
}
/* progress modal: returns promise resolved after duration */
function progress(o) {
  return new Promise(res => {
    $('#layer').innerHTML = `<div class="bkd"></div><div class="modal"><div class="mb"><h3>${o.title}</h3><p>${o.body || ''}</p>${o.dots ? '<div class="dots"><i></i><i></i><i></i></div>' : `<div class="pbar"><div></div></div><div class="ppct">0%</div>`}${o.warn ? `<div class="warn">${o.warn}</div>` : ''}</div>${o.cancel ? `<div class="mbtn"><button data-c>${T('취소')}</button></div>` : ''}</div>`;
    const dur = o.ms || 2600; const t0 = Date.now(); let done = false;
    const iv = setInterval(() => {
      const k = Math.min(1, (Date.now() - t0) / dur);
      const bar = $('#layer .pbar div'); if (bar) { bar.style.width = (k * 100) + '%'; $('#layer .ppct').textContent = Math.round(k * 100) + '%'; }
      if (o.onTick) o.onTick(k);
      if (k >= 1 && !done) { done = true; clearInterval(iv); setTimeout(() => { closeLayer(); res(true); }, 250); }
    }, 60);
    const c = $('#layer [data-c]'); if (c) c.onclick = () => { done = true; clearInterval(iv); closeLayer(); res(false); };
  });
}
function sheet(title, items) {
  return new Promise(res => {
    $('#layer').innerHTML = `<div class="bkd" data-x></div><div class="sheet">${title ? `<div class="sh-t">${title}</div>` : ''}${items.map((it, i) => `<button class="it" data-i="${i}">${it}</button>`).join('')}<button class="it cancel" data-x>${T('취소')}</button></div>`;
    $$('#layer [data-i]').forEach(b => b.onclick = () => { closeLayer(); res(+b.dataset.i); });
    $$('#layer [data-x]').forEach(b => b.onclick = () => { closeLayer(); res(-1); });
  });
}

async function onConnected(key, first) {
  const d = S.dev[key];
  S.conn = key; S.saved = key; S.target = key;
  S.rec = S.mode === 'parking' ? 'rec' : 'rec';
  logDev(T('앱과 Wi-Fi 연결됨'));
  if (first) { replace('connok', { key }); return; }
  goHome();
  await afterConnectTasks();
}
async function afterConnectTasks() {
  const d = D();
  await wait(350);
  if (!S.conn) return;
  if (d.key === 'GX4K' && !d.setupDone) { await firstSetupFlow(); }
  if (S.dl.fw && d.fw.cur !== d.fw.nw) { await fwInstallAsk(); return; }
  if (d.impact && S.mode === 'drive') aiImpactPopup();
}
function disconnect(reason) {
  if (!S.conn) return;
  S.conn = null;

}

/* ============ DASHCAM FILES (playback mode) ============ */
const FT = {  // file types
  N: { ko: '주행 일반', lbl: '주행', c: '#E07A5F' },
  E: { ko: '주행 충격', lbl: '주행', c: '#E07A5F', dot: '!' },
  M: { ko: '긴급 녹화', lbl: '긴급', c: '#F2A541' },
  P: { ko: '주차 모션', lbl: '모션', c: '#5B8DEF' },
  I: { ko: '주차 충격', lbl: '주차', c: '#E05A5A', dot: '!' },
  Y: { ko: '마이 폴더', lbl: 'my', c: '#8E8E93' },
};
function makeFiles(key, dayOffset) {
  const base = new Date(); base.setDate(base.getDate() - dayOffset);
  const ymd = `${base.getFullYear()}${pad(base.getMonth() + 1)}${pad(base.getDate())}`;
  const seq = dayOffset === 0 ? [['08', 'N'], ['08', 'N'], ['08', 'E'], ['09', 'N'], ['12', 'M'], ['13', 'P'], ['13', 'I'], ['17', 'N'], ['18', 'N'], ['18', 'E']] : [['07', 'N'], ['10', 'P'], ['11', 'I'], ['15', 'N'], ['19', 'M'], ['21', 'P']];
  const out = [];
  seq.forEach(([h, t], i) => {
    const mm = pad((i * 7 + 3) % 60), ss = pad((i * 13 + 21) % 60);
    const stem = `${ymd}-${h}h${mm}m${ss}s`;
    const start = 6 + (i * 37) % 240;
    if (key === 'GX4K') { // front/rear separate files
      out.push({ name: `${stem}_${t}_F`, t, ch: 'front', start, ai: false });
      out.push({ name: `${stem}_${t}_R`, t, ch: 'rear', start: 8 + (i * 29) % 200, ai: false });
    } else {
      const ai = t === 'I';
      out.push({ name: `${stem}_${ai ? 'I' : t}`, t, ch: 'front', start, ai, two: true });
      if (i === 3) out.push({ name: `${stem}_myN`, t: 'Y', ch: 'front', start: start + 40, two: true });
    }
  });
  return out.sort((a, b) => b.name.localeCompare(a.name)); // latest first
}

    }).join('') : `<div class="empty">${img('icon_file_dim', 'style="width:48px;opacity:.6"')}${T('영상이 없습니다')}</div>`}</div>`;

async function downloadFlow(x, p) {

async function shareFlow(files) {

      [T('블랙박스 연결이 되지 않아요.'), T('1. 블랙박스 상태를 확인해 주세요.') + '\n' + T('블랙박스 Wi-Fi가 ON 상태인지 확인해 주세요. ON 상태인 경우에도 연결이 되지 않을 시 블랙박스 전원을 껐다 켠 후 다시 연결을 시도해 주세요.') + '\n\n' + T('2. VPN 프로그램을 일시 중단해 주세요.') + '\n' + T('VPN (Proxy) 프로그램 사용하는 경우 특정 Address 통신을 제한 할 수 있기 때문에 블랙박스와 통신이 되지 않는 문제가 발생하여 연결이 끊어지거나, 앱이 강제 종료 될 수 있습니다. 파인뷰 Wi-Fi 앱 이용 중에는 VPN 프로그램 일시 정지 후 사용하시기 바랍니다.')],
      [T('Wi-Fi 비밀번호가 기억나지 않아요.'), T('[LCD 블랙박스]') + '\n' + T('블랙박스 Wi-Fi 화면에서 비밀번호를 확인 할 수 있습니다.') + '\n\n' + T('[NON-LCD 블랙박스]') + '\n' + T('블랙박스 Wi-Fi버튼을 길게 눌러 초기화 할 수 있습니다.') + '\n' + T('Wi-Fi 초기화 시 블랙박스가 재부팅되며 비밀번호가 12345678로 변경이 됩니다')],
      [T('비밀번호를 입력해도 연결이 되지 않아요.'), T('1. 올바른 비밀번호인지 확인해 주세요.') + '\n\n' + T('2. 블랙박스를 재부팅 해주세요.') + '\n' + T('블랙박스 전원을 껐다 켠 후, 다시 연결을 시도해 주세요')],
      [T('무선 Android Auto를 사용 중 이에요.'), T('스마트폰과 차량이 무선 Android Auto와 연결되어 있는 경우 블랙박스 Wi-Fi 연결에 간섭이 발생합니다.') + '\n' + T('1. 스마트폰 설정 바를 아래로 내려 주세요.') + '\n' + T('2. 알림 목록에서 Android Auto 종료 알림을 눌러 주세요.') + '\n' + T('3. 블랙박스 Wi-Fi 연결을 시도해 주세요.')],
      [T('파인뷰 Wi-fi 앱 지원 기기'), T('1. NON-LCD 타입') + '\nGX30, GX300, GX33/X33, GX400/GX1000, GX4K, GX35, GX36\n\n' + T('2. LCD 타입') + '\nX950 POWER, LXQ500/X3300, LXQ3000 POWER/X7000 POWER, X1200 POWER, GX7, LX8800 POWER, R5 POWER'],
    ] : [[T('영상 재생시 문제가 있습니다.'), T('VPN (Proxy) 프로그램 사용하는 경우 특정 Address 통신을 제한 할 수 있기 때문에 블랙박스와 통신이 되지 않는 문제가 발생하여 연결이 끊어지거나, 앱이 강제 종료 될 수 있습니다.\n파인뷰 Wi-Fi 앱 이용 중에는 VPN 프로그램 일시 정지 후 사용하시기 바랍니다.')]];
    return `${hdr(p.t === 'conn' ? T('블랙박스 연결이 안 되는 경우') : T('기타 도움말'))}<div class="body">${qa.map(([q, a]) => `<div class="qa"><button class="q" style="width:100%;text-align:left"><b>Q.</b><span style="flex:1">${q}</span>${ICON.chevD}</button><div class="a">${esc(a)}</div></div>`).join('')}</div>`;
  },
  mount(el) { bindCommon(el); $$('.qa .q', el).forEach(b => b.onclick = () => b.parentNode.classList.toggle('open')); }
};

/* ============ DEMO PANEL ============ */
function recLabel() {
  if (S.rec === 'update') return ['o', T('업데이트 설치 중 (녹화 중지)')];
  if (S.rec === 'reboot') return ['o', T('재부팅 중')];
  if (S.rec === 'stop-play') return ['', T('녹화 중지 · 재생 모드')];
  if (S.rec === 'stop-set') return ['', T('녹화 중지 · 설정 메뉴')];
  return ['r', S.mode === 'parking' ? T('녹화 중 (주차)') : T('녹화 중 (주행)')];
}
function demoHTML() {
  const d = S.dev[S.conn || S.target];
  const [lc, lt] = recLabel();
  const wifi = !S.bbWifi ? ['', 'OFF'] : S.conn === d.key ? ['g', T('앱 연결됨')] : ['b', T('대기 중 (연결 가능)')];
  return `<div class="dp-h">${img('icon_logo')}<span>Wi-Fi · Web Demo</span></div>
  <div class="dp-sub">${T('파인뷰 Wi-Fi 앱(Android) 시연용 웹 프로토타입입니다. 실제 블랙박스 없이 연결·녹화·업데이트 동작을 가상으로 재현합니다.')}</div>
  <div class="dp-t">Language</div>
  <div class="dp-seg"><button class="${LANG === 'ko' ? 'on' : ''}" data-lang="ko">한국어</button><button class="${LANG === 'en' ? 'on' : ''}" data-lang="en">English</button></div>
  <div class="dp-t">${T('가상 블랙박스')}</div>
  <div class="dp-seg" style="margin-bottom:8px"><button class="${d.key === 'GX4K' ? 'on' : ''}" data-tg="GX4K" ${S.conn ? 'disabled' : ''}>GX4K</button><button class="${d.key === 'X1200' ? 'on' : ''}" data-tg="X1200" ${S.conn ? 'disabled' : ''}>X1200 POWER</button></div>
  <div class="dp-dev">
    <div class="nm">${d.name}<small>${d.lcd ? T('LCD 타입 · QR 연결') : T('NON-LCD 타입 · 직접 연결')}</small></div>
    <div class="dp-row" style="margin-top:6px">${T('상태')}<b>${S.mode === 'parking' ? T('주차 모드') : T('주행 모드')}</b></div>
    <div class="dp-row">Wi-Fi<b><span class="led ${wifi[0]}"></span>${wifi[1]}</b></div>
    <div class="dp-row">${T('녹화')}<b><span class="led ${lc}"></span>${lt}</b></div>
    <div class="dp-row">${T('펌웨어')}<b>${d.fw.cur}${d.fw.cur !== d.fw.nw ? ` <span style="color:var(--red);font-size:11px">→ ${d.fw.nw}</span>` : ''}</b></div>
    ${d.key === 'X1200' ? `<div class="dp-row">${T('주차 충격 이력')}<b>${d.impact ? `<span class="led r"></span>${T('있음')}` : T('없음')}</b></div>` : ''}
    <div class="dp-log">${S.log.length ? S.log.map(l => `<div>${esc(l)}</div>`).join('') : `<div style="font-weight:400">${T('블랙박스 동작 로그가 여기에 표시됩니다.')}</div>`}</div>
  </div>
  <div class="dp-t">${T('시나리오')}</div>
  <div class="dp-btns">
    <button class="dp-btn full ${S.awaitRec ? 'hot' : ''}" data-a="rec" ${S.awaitRec ? '' : 'disabled'}>● ${T('REC 버튼 누르기')} ${S.awaitRec ? '' : `<span style="font-weight:400">(${T('페어링 단계에서 사용')})</span>`}</button>
    <button class="dp-btn" data-a="mode">${S.mode === 'parking' ? T('주행 모드로 전환') : T('주차 모드로 전환')}</button>
    <button class="dp-btn" data-a="wifi">${S.bbWifi ? T('블랙박스 Wi-Fi 끄기') : T('블랙박스 Wi-Fi 켜기')}</button>
    <button class="dp-btn" data-a="drop" ${S.conn ? '' : 'disabled'}>${T('연결 끊김 발생')}</button>
    <button class="dp-btn" data-a="fw">${T('새 펌웨어 알림')}</button>
    ${d.key === 'X1200' ? `<button class="dp-btn full" data-a="impact">${T('주차 중 충격 발생 (AI 충격 안내)')}</button>` : ''}
    <button class="dp-btn full" data-a="reset" style="color:var(--sub)">↺ ${T('처음부터 다시')}</button>
  </div>
  <div class="dp-note">${T('· 블랙박스 파일(재생 모드)·설정 메뉴에 들어가면 녹화가 중지되고, 홈으로 나오면 재개됩니다.')}<br>${T('· 녹화 방식·Wi-Fi 밴드 변경, 설정 초기화, 펌웨어 업데이트 후에는 블랙박스가 재부팅되며 연결이 해제됩니다.')}<br>${T('· 영상은 YouTube 샘플 영상을 사용하므로 인터넷 연결이 필요합니다.')}</div>`;
}
function renderDemo() {
  const h = demoHTML();
  ['#demo', '#demoM'].forEach(sel => {
    const el = $(sel); if (!el) return;
    const y = el.scrollTop; el.innerHTML = h; el.scrollTop = y;
    const log = $('.dp-log', el); if (log) log.scrollTop = 0;
    bindDemo(el);
  });
}
function setLang(l) {
  LANG = l; try { localStorage.setItem('fv_lang', l); } catch (e) { }
  document.documentElement.lang = l; closeLayer(); render(); renderDemo();
}
function bindDemo(el) {
  $$('[data-lang]', el).forEach(b => b.onclick = () => setLang(b.dataset.lang));
  $$('[data-tg]', el).forEach(b => b.onclick = () => { if (S.conn) return; S.target = b.dataset.tg; if (S.saved && S.saved !== S.target) { /* keep saved */ } renderDemo(); if (stack[stack.length - 1].id === 'home') render(); });
  $$('[data-a]', el).forEach(b => b.onclick = async () => {
    const a = b.dataset.a; const d = S.dev[S.conn || S.target];
    $('#demoSheet').classList.remove('on');
    if (a === 'rec' && S.awaitRec) S.awaitRec();
    if (a === 'mode') {
      S.mode = S.mode === 'parking' ? 'drive' : 'parking';
      logDev(S.mode === 'parking' ? T('시동 OFF → 주차 모드 전환') : T('시동 ON → 주행 모드 전환'));
      if (S.conn && inStack('settings', 'setsub') && S.mode === 'parking') { goHome(); toast(T('주차모드에서는 해당 기능을 제공하지 않습니다.')); }
      else if (stack[stack.length - 1].id === 'home') render();
    }
    if (a === 'wifi') {
      S.bbWifi = !S.bbWifi;
      logDev(S.bbWifi ? T('블랙박스 Wi-Fi ON') : T('블랙박스 Wi-Fi OFF'));
      if (!S.bbWifi && S.conn) { await modal({ title: T('Wi-Fi 연결 끊김'), body: T('블랙박스 연결이 해제되었습니다.\n블랙박스와 재연결 후 사용하세요.'), buttons: [{ t: T('확인'), pri: true }] }); disconnect(); }
    }
    if (a === 'drop' && S.conn) { logDev(T('Wi-Fi 신호 끊김')); await modal({ title: T('Wi-Fi 연결 끊김'), body: T('블랙박스 연결이 해제되었습니다.\n블랙박스와 재연결 후 사용하세요.'), buttons: [{ t: T('확인'), pri: true }] }); disconnect(T('앱과 Wi-Fi 연결 해제')); }
    if (a === 'fw') {
      const dv = S.dev[S.conn || S.saved || S.target];
      if (dv.fw.cur === dv.fw.nw) { const p = dv.fw.nw.split('.'); p[2] = pad3(+p[2] + 3); dv.fw.nw = p.join('.'); }
      S.dl.fw = false; renderDemo();
      if (!S.saved && !S.conn) { toast(T('블랙박스를 먼저 한 번 연결해 주세요. (연결 이력이 있어야 업데이트 알림을 받을 수 있어요)'), 3200); return; }
      if (stack[stack.length - 1].id !== 'home') goHome(); else render();
      S.updPopupShown = true; setTimeout(fwDownloadFlow, 300);
    }
    if (a === 'impact') { d.impact = true; logDev(T('주차 중 충격 감지 (AI: 운전석 전방 · 강한 충격)')); if (S.conn && S.mode === 'drive') aiImpactPopup(); else toast(T('다음 연결 시 AI 충격 안내 팝업이 표시됩니다.')); }
    if (a === 'reset') { try { sessionStorage.clear(); } catch (e) { } location.reload(); }
  });
}
function pad3(n) { return String(n).padStart(3, '0'); }

/* ============ INIT ============ */
(function init() {
  document.documentElement.lang = LANG;
  for (const k in S.dev) { }
  initStorage();
  stack = [{ id: 'home' }];
  render();
  renderDemo();
  tickClock(); setInterval(tickClock, 15000);
  logDev(T('블랙박스 전원 ON → 녹화 시작'));
  $('#demoFab').onclick = () => { renderDemo(); $('#demoSheet').classList.add('on'); };
  $('#demoClose').onclick = () => $('#demoSheet').classList.remove('on');
  $('#demoSheet').onclick = e => { if (e.target.id === 'demoSheet') $('#demoSheet').classList.remove('on'); };
})();

</script>
</body>
</html>
